# nginx site for the moji web app: /etc/nginx/sites-available/moji-web
# certbot adds the HTTPS (443) part and the HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name moji.annvea.com;

    root /srv/moji-web/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Built files have a content hash in their name, so they can be cached forever.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the app itself: always check for a new version.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
